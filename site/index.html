<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Governance Map</title>
  <meta name="description" content="A searchable, interactive register of binding AI laws, soft-law instruments, standards and international processes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <h1>🌍 AI Governance Map</h1>
        <p class="tagline">Global tracker of binding AI laws, soft-law instruments, and standards.</p>
      </div>
      <nav id="nav" class="nav" aria-label="Views"></nav>
    </div>
  </header>

  <main id="main" class="container" aria-live="polite">
    <noscript>
      <div class="noscript-warning">This site needs JavaScript to load the register data. Please enable it, or view the raw data in <code>data/instruments.json</code>.</div>
    </noscript>
    <p class="loading">Loading register…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><span id="stat-total">–</span> entries · <span id="stat-jurisdictions">–</span> jurisdictions · sourced from <code>data/instruments.json</code>. Entries marked “Not yet checked” have not been verified against their primary source.</p>
    </div>
  </footer>

  <!-- Sticky comparison tray -->
  <div id="tray" hidden>
    <div class="tray-left"><strong>Compare:</strong> <span id="tray-items"></span></div>
    <div class="tray-right">
      <button id="tray-compare" class="btn" type="button" disabled>View comparison →</button>
      <button id="tray-clear" class="btn btn-secondary" type="button">Clear</button>
    </div>
  </div>

  <!-- Entry detail modal -->
  <dialog id="entry-modal" aria-labelledby="modal-title">
    <div id="modal-body"></div>
    <form method="dialog">
      <button class="btn btn-secondary modal-close" type="submit">Close</button>
    </form>
  </dialog>

  <!-- Toast notifications -->
  <div id="toast-container" role="status" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
